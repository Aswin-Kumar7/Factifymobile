name: CI

# Tests only. No scheduled jobs and no provider credentials live here —
# scheduled ingestion is owned by the deployed service (codexplan.md §6), because
# public-repository schedules are disabled automatically after a period of
# inactivity and credentials do not belong in a public repository.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.9"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Live tests are excluded by default (pyproject addopts). Database tests skip
      # unless FACTIFY_DATABASE_URL is present, which it is not in CI.
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: pip-audit
        run: uv run pip-audit --strict

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The image built here is the artifact that gets deployed — same Dockerfile,
      # same lockfile, no separate build path.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: factify:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and probe liveness
        run: |
          docker run -d --name factify-ci -p 8080:8080 factify:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          echo "health probe never succeeded"
          docker logs factify-ci
          exit 1

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|perf|build|ci|revert)(\([a-z0-9._-]+\))?!?: .+'
          failed=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Non-conventional commit subject: $subject"
              failed=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $failed
