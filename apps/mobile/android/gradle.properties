# A truststore holding the JDK's own roots plus every root Windows trusts, and
# generous HTTP timeouts.
#
# Required wherever TLS is intercepted. The interceptor's CA lives in the Windows
# certificate store and is unknown to Java, so Gradle cannot resolve a dependency it
# has not already cached: it fails with "PKIX path building failed" against
# dl.google.com and Maven Central. The tidy fix would be
# `-Djavax.net.ssl.trustStoreType=Windows-ROOT`, and it does not work here — the
# JetBrains runtime Android Studio ships has no SunMSCAPI provider and Gradle's HTTP
# client reports "Windows-ROOT not found".
#
# Generate the file with `android/build_truststore.ps1`; it is gitignored, because it
# contains whatever CA this network intercepts with and that is a fact about one
# machine. On a machine without interception it is simply a superset of the public
# roots, so the setting is inert rather than wrong.
#
# The timeouts are for the same environment: interception adds a handshake to every
# artifact fetch and the defaults are tight enough to fail on a cold cache. The Python
# side solves the certificate half with truststore.inject_into_ssl(); see
# docs/ops-notes.md.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStore=windows-roots.jks -Djavax.net.ssl.trustStorePassword=changeit -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
