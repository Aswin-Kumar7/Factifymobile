[project]
name = "factify"
version = "0.1.0"
description = "Evidence-based content verification. Verdicts from citable evidence, never from model confidence."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "python-json-logger>=2.0.7",
    "httpx>=0.27",
    "pillow>=11.0",
    "trafilatura>=2.0",
    "pypdf>=5.1",
    "fastembed>=0.5",
    "feedparser>=6.0",
    # Multipart parsing for /v1/verify/file. FastAPI raises at import time without
    # it, so an upload route cannot be added by accident and left broken.
    "python-multipart>=0.0.20",
    "c2pa-python>=0.37.12",
]

[project.optional-dependencies]
# The detectors and readers that run on our own server instead of another company's
# API (docs: app/media/detectors, app/extraction/local_ocr.py, app/sources/stance.py).
# Optional, so the test suite and CI do not install PyTorch; `uv sync --extra models`.
models = [
    # CPU builds only (see [tool.uv.sources]): the server has no GPU, and the default
    # Linux wheel carries ~2.5 GB of CUDA libraries it would never load.
    "torch>=2.8",
    "torchvision>=0.23",
    "timm>=1.0.20",
    # GenD's model code was written against 4.x; 5.x changed loading.
    "transformers>=4.56,<5",
    "peft>=0.15",
    "safetensors>=0.4",
    # Text in pictures, read on the server: PaddleOCR's models through ONNX Runtime.
    "rapidocr>=3.9.2",
    # Puts a right-to-left (Urdu) line RapidOCR read back into reading order. LGPL,
    # used unmodified as a library.
    "python-bidi>=0.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "lxml-stubs>=0.5.1",
    "truststore>=0.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Test layout (M01)
#   unit    pure core — no database, no network, no model, no fixtures
#   replay  snapshot replay against stored source snapshots (M47)
#   live    real outbound calls — excluded from CI, opt-in only
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not live and not model'"
asyncio_mode = "auto"
markers = [
    "unit: pure core; no database, network or model access",
    "db: requires a live Postgres with pgvector (FACTIFY_DATABASE_URL)",
    "replay: runs against stored source snapshots",
    "live: performs real outbound calls; never runs in CI",
    "model: requires downloaded model weights (FACTIFY_MODEL_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit / security
    "ASYNC",    # async correctness
    "T20",      # no print statements
    "RUF",
]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", # ambiguous unicode in strings — prose uses en/em dashes deliberately
    "RUF002", # ambiguous unicode in docstrings — same
    "RUF003", # ambiguous unicode in comments — same
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# A command-line entry point. Its output IS the interface, so stdout is not a
# stray debug print; logging would put the report behind a handler nobody configured.
"app/audit/run.py" = ["T201"]
# Same reasoning: a run harness reports to stdout, which is the whole point of it.
"scripts/*.py" = ["T201"]
"tests/*" = [
    "S104", "S105", "S106",  # fixture strings, not real binds or secrets
    "S603", "S607",          # tests build fixture media by calling ffmpeg directly
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Ships no type information. Its output is treated as untrusted feed data and
# validated by parse_feed rather than by the type checker.
[[tool.mypy.overrides]]
module = ["feedparser.*"]
ignore_missing_imports = true

# Optional at runtime (M36 is P1) and not installed here. Its absence is a supported
# configuration that returns "unknown", so the import is guarded rather than required.
[[tool.mypy.overrides]]
module = ["c2pa.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
